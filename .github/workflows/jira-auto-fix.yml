name: JIRA Auto Fix

on:
  repository_dispatch:
    types: [jira-issue-labeled]

env:
  GIT_USER_NAME: "JIRA Automation"
  GIT_USER_EMAIL: "automation@jira.local"

jobs:
  auto-fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract JIRA Issue Details
        run: |
          echo "ISSUE_KEY=${{ github.event.client_payload.issueKey }}" >> $GITHUB_ENV
          echo "SUMMARY=${{ github.event.client_payload.summary }}" >> $GITHUB_ENV
          echo "DESCRIPTION=${{ github.event.client_payload.description }}" >> $GITHUB_ENV

      - name: Create Feature Branch
        run: |
          git config user.name "${{ env.GIT_USER_NAME }}"
          git config user.email "${{ env.GIT_USER_EMAIL }}"
          git checkout -b feature/${{ env.ISSUE_KEY }}

      - name: Analyze Issue with Copilot
        run: |
          echo "📋 JIRA Issue: ${{ env.ISSUE_KEY }}"
          echo "📝 Summary: ${{ env.SUMMARY }}"
          echo "📄 Description: ${{ env.DESCRIPTION }}"
          echo ""
          echo "🤖 Running Copilot analysis..."
          copilot explain "${{ env.DESCRIPTION }}" || true

      - name: Apply Copilot Fix
        run: |
          echo "🔧 Applying fix with Copilot..."
          copilot fix "${{ env.DESCRIPTION }}" || true
          echo "✅ Copilot analysis complete"

      - name: Commit Changes
        run: |
          if [[ -n $(git status -s) ]]; then
            echo "📤 Committing changes..."
            git add -A
            git commit -m "fix: ${{ env.ISSUE_KEY }} - ${{ env.SUMMARY }}" \
              -m "Description: ${{ env.DESCRIPTION }}"
            git push -u origin feature/${{ env.ISSUE_KEY }}
            echo "✅ Changes pushed"
          else
            echo "ℹ️  No changes detected - creating empty commit"
            git commit --allow-empty -m "chore: ${{ env.ISSUE_KEY }} - Review and apply fixes"
            git push -u origin feature/${{ env.ISSUE_KEY }}
          fi

      - name: Create Pull Request
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const { data: pullRequest } = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: "fix: ${{ env.ISSUE_KEY }} - ${{ env.SUMMARY }}",
                head: "feature/${{ env.ISSUE_KEY }}",
                base: "master",
                body: `## JIRA Issue: ${{ env.ISSUE_KEY }}\n\n**Summary:**\n${{ env.SUMMARY }}\n\n**Description:**\n${{ env.DESCRIPTION }}\n\n---\n\n**Copilot Analysis:**\nCopilot has analyzed this issue and applied suggested fixes. Please review the changes carefully.\n\n**Next Steps:**\n1. Review code changes\n2. Test the changes locally\n3. Approve and merge when ready`
              });
              console.log(`✅ Created PR: ${pullRequest.html_url}`);
            } catch (error) {
              console.error(`Error: ${error.message}`);
              throw error;
            }