name: JIRA Auto Fix

on:
  repository_dispatch:
    types: [jira-issue-labeled]

env:
  GIT_USER_NAME: "Copilot Automation"
  GIT_USER_EMAIL: "copilot@github.com"

jobs:
  auto-fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract JIRA Issue Details
        id: jira
        run: |
          echo "ISSUE_KEY=${{ github.event.client_payload.issueKey }}" >> $GITHUB_ENV
          echo "SUMMARY=${{ github.event.client_payload.summary }}" >> $GITHUB_ENV
          echo "DESCRIPTION=${{ github.event.client_payload.description }}" >> $GITHUB_ENV
          echo "ACCEPTANCE_CRITERIA=${{ github.event.client_payload.acceptanceCriteria }}" >> $GITHUB_ENV

      - name: Create Feature Branch
        run: |
          git config user.name "${{ env.GIT_USER_NAME }}"
          git config user.email "${{ env.GIT_USER_EMAIL }}"
          git checkout -b feature/${{ env.ISSUE_KEY }}-fix

      - name: Install Copilot CLI
        run: npm install -g @github/copilot-cli

      - name: Run Copilot CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Processing Issue: ${{ env.ISSUE_KEY }}"
          echo "Summary: ${{ env.SUMMARY }}"
          echo "Description: ${{ env.DESCRIPTION }}"
          
          copilot explain "${{ env.DESCRIPTION }}"

      - name: Commit Changes
        run: |
          if [[ -n $(git status -s) ]]; then
            git add -A
            git commit -m "fix: ${{ env.ISSUE_KEY }} - ${{ env.SUMMARY }}"
            git push origin feature/${{ env.ISSUE_KEY }}-fix
          else
            echo "No changes detected"
          fi

      - name: Create Pull Request
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const { data: pullRequest } = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: "fix: ${{ env.ISSUE_KEY }} - ${{ env.SUMMARY }}",
                head: "feature/${{ env.ISSUE_KEY }}-fix",
                base: "main",
                body: `Fixes ${{ env.ISSUE_KEY }}\n\n**Description:**\n${{ env.DESCRIPTION }}\n\n**Acceptance Criteria:**\n${{ env.ACCEPTANCE_CRITERIA }}`
              });
              console.log(`Created PR: ${pullRequest.html_url}`);
            } catch (error) {
              console.log(`PR info: ${error.message}`);
            }