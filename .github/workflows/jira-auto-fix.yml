name: JIRA Auto Fix

on:
  repository_dispatch:
    types: [jira-issue-labeled]

env:
  GIT_USER_NAME: "JIRA Automation"
  GIT_USER_EMAIL: "automation@jira.local"

jobs:
  auto-fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract JIRA Issue Details
        run: |
          echo "ISSUE_KEY=${{ github.event.client_payload.issueKey }}" >> $GITHUB_ENV
          echo "SUMMARY=${{ github.event.client_payload.summary }}" >> $GITHUB_ENV
          echo "DESCRIPTION=${{ github.event.client_payload.description }}" >> $GITHUB_ENV

      - name: Create Feature Branch
        run: |
          git config user.name "${{ env.GIT_USER_NAME }}"
          git config user.email "${{ env.GIT_USER_EMAIL }}"
          git checkout -b feature/${{ env.ISSUE_KEY }}

      - name: Create Pull Request
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pullRequest } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "fix: ${{ env.ISSUE_KEY }} - ${{ env.SUMMARY }}",
              head: "feature/${{ env.ISSUE_KEY }}",
              base: "main",
              body: `## JIRA Issue: ${{ env.ISSUE_KEY }}\n\n**Summary:**\n${{ env.SUMMARY }}\n\n**Description:**\n${{ env.DESCRIPTION }}\n\n---\n\n**Next Steps:**\n1. Review this PR\n2. Use \`copilot explain\` to understand the issue\n3. Use \`copilot fix\` to implement the solution\n4. Commit and push changes\n5. Merge when ready`
            });
            console.log(`Created PR: ${pullRequest.html_url}`);